# Local project identifier. Bind to YOUR remote Supabase project with:
#   supabase link --project-ref <your-project-ref>
# That command rewrites this value in place. Don't commit a project_id that
# isn't yours — `supabase db push` and `supabase functions deploy` use it.
project_id = "toledo-lokal"

# Keep the server-side password policy in sync with the sign-up form rules in
# src/pages/Auth.tsx (8+ chars, mixed case, number, symbol).
[auth]
# Canonical public domain. Auth emails redirect here after verification, so it
# must NOT be the raw *.vercel.app deployment (that host sits behind Vercel
# Deployment Protection and shows a "Log in to Vercel" wall). Keep in sync with
# src/lib/site-url.ts.
site_url = "https://toledolokal.com"
# Every URL the client may pass as emailRedirectTo / redirectTo must be listed
# here or Supabase silently falls back to site_url.
additional_redirect_urls = [
  "https://toledolokal.com",
  "https://toledolokal.com/",
  "https://toledolokal.com/auth",
  "http://localhost:8080",
  "http://localhost:8080/auth",
]
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

# Route all auth emails (signup confirmation, password reset, magic link, email
# change) through the send-auth-email edge function so they come from
# "ToledoLokal <noreply@toledolokal.com>" via Resend instead of the default
# "Supabase Auth" sender + default templates.
#
# Before this takes effect you must, in the Supabase dashboard / CLI secrets:
#   1. Enable the Send Email hook (this block does that on `supabase config push`).
#   2. Set the hook secret:  supabase secrets set SEND_EMAIL_HOOK_SECRET=v1,whsec_...
#      (Supabase generates this secret when you enable the hook in the dashboard.)
#   3. Set RESEND_API_KEY and verify the toledolokal.com domain in Resend.
# project ref taken from the linked Supabase project (Supabase Preview integration).
[auth.hook.send_email]
enabled = true
uri = "https://nnepslwwqjxfhlurwoyw.supabase.co/functions/v1/send-auth-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

[functions.get-signed-urls-batch]
verify_jwt = false

[functions.moderate-content]
verify_jwt = false

[functions.ask-toledo]
verify_jwt = false

[functions.get-maps-key]
verify_jwt = false

[functions.get-signed-url]
verify_jwt = false

[functions.check-subscription]
verify_jwt = false

[functions.create-checkout]
verify_jwt = false

[functions.customer-portal]
verify_jwt = false

[functions.loop-scan-qr]
verify_jwt = false

[functions.send-auth-email]
verify_jwt = false

